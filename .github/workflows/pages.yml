name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: hugocxl/stack/.github/workflows/reusable-pages.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
