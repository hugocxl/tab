name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: hugocxl/stack/.github/workflows/reusable-ci.yml@main
    with:
      setup-command: |
        command -v rg > /dev/null || brew install ripgrep
        command -v zig > /dev/null || brew install zig
