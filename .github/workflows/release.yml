name: Release

on:
  push:
    branches: [main]
    tags: ['v*-beta.*']

permissions:
  contents: read

concurrency:
  group: tab-release
  cancel-in-progress: false

jobs:
  release:
    uses: hugocxl/stack/.github/workflows/reusable-release-macos.yml@main
    with:
      app-name: Tab
      deployment-target: '14.0'
      enable-beta: true
      require-update-key: true
      setup-command: |
        command -v rg > /dev/null || brew install ripgrep
        command -v zig > /dev/null || brew install zig
      artifact-paths: |
        build/release/Tab-${RELEASE_VERSION}-arm64.dmg
        build/release/update.json
        build/release/TabPlugin-*-${RELEASE_VERSION}-arm64.zip
    secrets: inherit
