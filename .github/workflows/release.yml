name: Release

# A tag vX.Y.Z publishes a stable release, the feed of
# releases/latest/download/update.json. A tag vX.Y.Z-beta.N, where N is the
# tagged commit's count (scripts/tag-release.sh makes both), publishes a
# prerelease and moves the beta feed, the update.json of the `beta` release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: tab-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the release tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.([1-9][0-9]*)$ ]]; then
            CHANNEL=beta
            COUNT="$(git rev-list --count HEAD)"
            if [ "${BASH_REMATCH[1]}" != "$COUNT" ]; then
              echo "Error: a beta tag ends in its commit's count; tag this commit v${VERSION%-beta.*}-beta.$COUNT" >&2
              exit 1
            fi
          else
            echo 'Error: release tags must be vX.Y.Z or vX.Y.Z-beta.N' >&2
            exit 1
          fi
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Error: release only commits on main' >&2
            exit 1
          fi
          test "$(uname -m)" = arm64
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
      - name: Use the Xcode the project is developed with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          swift --version
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/cache@v4
        with:
          path: vendor/GhosttyVT.xcframework
          key: ghostty-vt-arm64-${{ runner.os }}-${{ hashFiles('scripts/build-ghostty.sh', 'vendor/ghostty-vt/clear-screen.patch') }}
      - name: Validate builds, tests and debug bundle
        run: |
          set -euo pipefail
          # Find in Files runs ripgrep; its tests need it like the app does.
          command -v rg > /dev/null || brew install ripgrep
          scripts/validate.sh
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12:?Developer ID certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          umask 077
          CERTIFICATE="$RUNNER_TEMP/tab-release-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/tab-release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:/ {print $2; exit}')"
          : "${IDENTITY:?No Developer ID Application identity found}"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple and verify release
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          REQUIRE_NOTARIZATION: '1'
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          fi
          scripts/release.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Publish complete assets through a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/tab-release.json"; then
            if [ "$(plutil -extract isDraft raw "$RUNNER_TEMP/tab-release.json")" != true ]; then
              echo 'Error: this release is already public; its assets are immutable' >&2
              exit 1
            fi
          else
            PRERELEASE=--prerelease=false
            if [ "$RELEASE_CHANNEL" = beta ]; then PRERELEASE=--prerelease; fi
            gh release create "$TAG" --verify-tag --draft --latest=false "$PRERELEASE" \
              --title "Tab $RELEASE_VERSION" --generate-notes
          fi
          ASSETS=("build/release/Tab-$RELEASE_VERSION-arm64.dmg" build/release/update.json)
          gh release upload "$TAG" --clobber "${ASSETS[@]}"
          for ASSET in "${ASSETS[@]}"; do
            NAME="$(basename "$ASSET")"
            REMOTE_SIZE="$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .size")"
            test "$REMOTE_SIZE" = "$(stat -f %z "$ASSET")"
          done
          if [ "$RELEASE_CHANNEL" = beta ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            exit 0
          fi
          # Only a newer stable release becomes the feed; a patch to an older
          # line is published without moving it backwards.
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          NEWEST="$(printf '%s\n%s\n' "${LATEST#v}" "$RELEASE_VERSION" | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$NEWEST" = "$RELEASE_VERSION" ]; then LATEST_FLAG=--latest; else LATEST_FLAG=--latest=false; fi
          gh release edit "$TAG" --draft=false --prerelease=false "$LATEST_FLAG"
      - name: Move the beta feed
        if: env.RELEASE_CHANNEL == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view beta > /dev/null 2>&1; then
            gh release create beta --prerelease --latest=false --target "$GITHUB_SHA" --title 'Tab Beta feed' \
              --notes 'The update feed of Tab betas. Each beta is published as its own vX.Y.Z-beta.N release.'
          fi
          # Betas are ordered by their commit count: never move the feed back.
          CURRENT=0
          if gh release download beta --pattern update.json --dir "$RUNNER_TEMP/beta-feed" 2> /dev/null; then
            CURRENT="$(plutil -extract version raw "$RUNNER_TEMP/beta-feed/update.json" | sed -n 's/.*-beta\.\([0-9]*\)$/\1/p')"
          fi
          if [ "${RELEASE_VERSION##*-beta.}" -le "${CURRENT:-0}" ]; then
            echo "The beta feed already names a newer beta (build $CURRENT)"
            exit 0
          fi
          gh release upload beta --clobber build/release/update.json
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: build/validation/*.log
          if-no-files-found: ignore
      - name: Remove signing keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/tab-release-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RUNNER_TEMP/tab-release-certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
